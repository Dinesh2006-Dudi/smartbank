server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**
        - id: llm-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/bot/**
          filters:
            - StripPrefix=2